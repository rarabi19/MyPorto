# Workflow untuk deploy konten statis ke GitHub Pages
name: Deploy static content to Pages

on:
  # Berjalan saat ada push ke branch main
  push:
    branches: ["main"]

  # Memungkinkan menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

# Mengatur izin GITHUB_TOKEN untuk mengizinkan deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Menghindari bentrokan deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Jika index.html ada di root folder, gunakan '.'
          # Jika ada di dalam folder lain (misal: 'src'), ganti menjadi './src'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
