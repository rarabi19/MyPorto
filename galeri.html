<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - MyPortfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              black: '#0a0a0a',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="public/css/style.css" />
    <script defer src="public/js/navbar.js"></script>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="bg-pattern"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div id="navbar"></div>

    <main class="flex-grow pt-32 pb-12 px-6 w-full flex justify-center items-center">
        <div class="max-w-5xl w-full fade-in-up text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-12 tracking-tight border-b border-white/10 pb-6 inline-block">
                My <span class="gradient-text">Gallery</span>
            </h1>
            
            <div class="relative group rounded-2xl overflow-hidden border border-emerald-500/20 shadow-[0_0_30px_rgba(0,255,149,0.05)] mx-auto">
                <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors duration-500 z-10"></div>
                <img src="public/images/galeri1.png" alt="My Gallery" class="w-full h-auto object-cover grayscale group-hover:grayscale-0 transform group-hover:scale-105 transition-all duration-700">
            </div>
        </div>
    </main>
</body>
</html>
