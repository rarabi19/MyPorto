<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificates - MyPortfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              black: '#0a0a0a',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="public/css/style.css" />
    <script defer src="public/js/navbar.js"></script>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="bg-pattern"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div id="navbar"></div>

    <main class="flex-grow pt-32 pb-12 px-6 w-full text-center">
        <div class="max-w-7xl mx-auto fade-in-up">
            <h1 class="text-4xl md:text-5xl font-bold mb-16 tracking-tight border-b border-white/10 pb-6 inline-block">
                My <span class="gradient-text">Certificates</span>
            </h1>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
                <!-- Cert 1 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(0,255,149,0.2)]">
                    <img src="public/images/sertif1.png" alt="Sertifikat 1" class="w-full h-auto object-cover">
                </div>
                <!-- Cert 2 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(0,255,149,0.2)]">
                    <img src="public/images/sertif2.png" alt="Sertifikat 2" class="w-full h-auto object-cover">
                </div>
                <!-- Cert 3 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(0,255,149,0.2)]">
                    <img src="public/images/sertif3.png" alt="Sertifikat 3" class="w-full h-auto object-cover">
                </div>
                <!-- Cert 4 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(0,255,149,0.2)]">
                    <img src="public/images/sertif4.png" alt="Sertifikat 4" class="w-full h-auto object-cover">
                </div>
                <!-- Cert 5 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(0,255,149,0.2)]">
                    <img src="public/images/sertif5.png" alt="Sertifikat 5" class="w-full h-auto object-cover">
                </div>
                <!-- Cert 6 -->
                <div class="border border-white/20 rounded-xl overflow-hidden grayscale hover:grayscale-0 cursor-pointer transition-all duration-500 hover:scale-105 hover:rotate-1 hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                    <img src="public/images/sertif6.png" alt="Sertifikat 6" class="w-full h-auto object-cover">
                </div>
            </div>

            <div class="mt-8">
                <a href="https://www.linkedin.com/in/haniva-azzahra-3ab578241/" target="_blank" class="uiverse-btn">
                    <i class="fab fa-linkedin text-2xl mr-3"></i> Selengkapnya di LinkedIn
                </a>
            </div>
        </div>
    </main>
</body>
</html>
