<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - MyPortfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        black: '#0a0a0a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="public/css/style.css" />
    <script defer src="public/js/navbar.js"></script>
</head>

<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="bg-pattern"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="navbar"></div>

    <main class="flex-grow pt-32 pb-12 px-6 w-full flex justify-center items-center">
        <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-16 fade-in-up">

            <div class="space-y-8">
                <div>
                    <h2 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">Hubungi Saya</h2>
                    <p class="text-gray-400 text-lg">Silakan kirim pesan atau saran kamu melalui form di bawah ini.</p>
                </div>

                <div class="space-y-6">
                    <div class="flex items-center space-x-4 bg-white/5 p-4 rounded-xl border border-white/10 transition-colors hover:bg-white/10 group">
                        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Email</p>
                            <p class="font-semibold text-gray-200">rarabi191@gmail.com</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4 bg-white/5 p-4 rounded-xl border border-white/10 transition-colors hover:bg-white/10 group">
                        <div class="w-12 h-12 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">WhatsApp</p>
                            <p class="font-semibold text-gray-200">+62 832-3556-5349</p>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-4 pt-4 border-t border-white/10">
                    <a href="https://instagram.com/_azzahraa_19/" target="_blank"
                        class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center hover:bg-emerald-500 hover:text-black transition-all"><i
                            class="fab fa-instagram"></i></a>
                    <a href="https://github.com/rarabi19" target="_blank"
                        class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center hover:bg-cyan-500 hover:text-black transition-all"><i
                            class="fab fa-github"></i></a>
                </div>
            </div>

            <div class="glass p-8 rounded-2xl shadow-2xl">
                <form action="mailto:rarabi191@gmail.com" method="post" enctype="text/plain" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Nama Lengkap</label>
                        <input type="text" name="name"
                            class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-lg text-white placeholder-gray-600 focus:bg-white/10 focus:border-white/50 focus:outline-none transition-all"
                            placeholder="John Doe" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Email Aktif</label>
                        <input type="email" name="email"
                            class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-lg text-white placeholder-gray-600 focus:bg-white/10 focus:border-white/50 focus:outline-none transition-all"
                            placeholder="john@example.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Subjek (Opsional)</label>
                        <input type="text" name="subject"
                            class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-lg text-white placeholder-gray-600 focus:bg-white/10 focus:border-white/50 focus:outline-none transition-all"
                            placeholder="Kolaborasi Project">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Pesan</label>
                        <textarea name="message" rows="4"
                            class="w-full bg-white/5 border border-white/10 px-4 py-3 rounded-lg text-white placeholder-gray-600 focus:bg-white/10 focus:border-white/50 focus:outline-none transition-all resize-none"
                            placeholder="Tulis pesan atau saran di sini..." required></textarea>
                    </div>
                    <button type="submit" class="uiverse-btn w-full text-center">
                        <i class="fas fa-paper-plane mr-2 relative z-10"></i> <span class="relative z-10">Kirim
                            Pesan</span>
                    </button>
                </form>
            </div>

        </div>
    </main>
</body>

</html>
